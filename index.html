<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1F4FD1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Drills">
<title>Drills de Inglés</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=JetBrains+Mono:wght@500&display=swap">
<style>
html,body{margin:0;height:100%}[hidden]{display:none!important}
/* Layout: una columna de 560px, pensada para el pulgar: contenido arriba, acciones fijas abajo. */
:root{
  --bg:#F2F4F1; --surface:#FFFFFF; --ink:#16201D; --muted:#5B6A64; --line:#D9E0DB;
  --accent:#1F4FD1; --accent-ink:#FFFFFF; --accent-soft:#E2E9FB;
  --good:#1D7A4F; --good-soft:#DCF0E4; --warn:#9A6200; --warn-soft:#FAEDD2; --bad:#BE3A31; --bad-soft:#F8DFDB;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1312; --surface:#161D1B; --ink:#E5EBE8; --muted:#93A29C; --line:#28322F;
  --accent:#8EA7FF; --accent-ink:#0E1312; --accent-soft:#1D2646;
  --good:#5DC993; --good-soft:#143023; --warn:#E6B04C; --warn-soft:#33280F; --bad:#F08279; --bad-soft:#3A1C19;
  color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1312; --surface:#161D1B; --ink:#E5EBE8; --muted:#93A29C; --line:#28322F;
  --accent:#8EA7FF; --accent-ink:#0E1312; --accent-soft:#1D2646;
  --good:#5DC993; --good-soft:#143023; --warn:#E6B04C; --warn-soft:#33280F; --bad:#F08279; --bad-soft:#3A1C19;
  color-scheme:dark; }

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0}
#app{max-width:560px;margin:0 auto;padding-block:18px 150px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.15}
h1{font-size:1.55rem}
h2{font-size:1.15rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.stack{display:flex;flex-direction:column;gap:12px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}

/* Botones */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 16px;min-height:48px;font-weight:700}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.big{min-height:58px;font-size:1.08rem;width:100%}
.btn.ghost{background:transparent}
.btn.link{border:0;background:none;padding:6px 0;min-height:0;color:var(--accent);font-weight:700}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.mic{display:flex;align-items:center;justify-content:center;gap:8px}
.btn.mic svg{width:20px;height:20px}
.btn.mic.listening{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.btn.mic.listening{animation:none}}
.interim{color:var(--muted)}
label.chk{display:flex;gap:10px;align-items:center;font-weight:400}
label.chk input{width:20px;height:20px}

/* Barra inferior fija */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom, 0px));z-index:5}
.dock-in{max-width:560px;margin:0 auto;display:flex;gap:10px}
.dock-in > *{flex:1}
.tabs{display:flex;max-width:560px;margin:0 auto}
.tab{flex:1;border:0;background:none;padding:8px 4px;min-height:52px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:.8rem;font-weight:700}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}

/* Cajas de Leitner (0–6) */
.boxes{display:inline-flex;gap:3px;vertical-align:middle}
.boxes i{width:10px;height:14px;border-radius:3px;border:1.5px solid var(--line);display:block}
.boxes i.on{background:var(--accent);border-color:var(--accent)}

.pill{display:inline-block;font-family:var(--mono);font-size:.7rem;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.pill.learning{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.pill.mastered{color:var(--good);background:var(--good-soft);border-color:transparent}
.pill.focus{color:var(--accent);background:var(--accent-soft);border-color:transparent}

/* Inicio */
.focus-card{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent) inset}
.mix{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px}
.mix span{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.win{background:var(--good-soft);border-color:transparent}
.win h3{color:var(--good)}

/* Drill */
.drillhead{display:flex;align-items:center;gap:12px}
.segs{flex:1;display:flex;gap:3px}
.segs span{flex:1;height:6px;border-radius:3px;background:var(--line)}
.segs span.correct{background:var(--good)} .segs span.almost{background:var(--warn)} .segs span.incorrect{background:var(--bad)}
.segs span.now{background:var(--accent)}
.es-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px 20px;display:flex;flex-direction:column;gap:14px}
.es{font-family:var(--display);font-weight:600;font-size:1.6rem;line-height:1.2;text-wrap:balance}
.tag{font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:6px;background:var(--accent-soft);color:var(--accent);align-self:flex-start}
.tag.mixed{background:var(--warn-soft);color:var(--warn)}
.tag.review{background:var(--good-soft);color:var(--good)}
.hint{font-family:var(--mono);font-size:.95rem;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px;align-self:flex-start}
textarea#ans{width:100%;min-height:96px;resize:vertical;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:14px;font-size:1.15rem;line-height:1.4}
textarea#ans:focus{border-color:var(--accent);outline:none}
.fb{display:flex;flex-direction:column;gap:14px}
.fb .line{font-size:1.12rem;line-height:1.45;overflow-wrap:anywhere}
.fb .x{background:var(--bad-soft);color:var(--bad);border-radius:4px;padding:0 3px;text-decoration:line-through;text-decoration-thickness:1.5px}
.fb .miss{background:var(--good-soft);color:var(--good);border-radius:4px;padding:0 3px;font-weight:700}
.rule{border-left:3px solid var(--accent);padding:4px 0 4px 12px}
.alts{display:flex;flex-direction:column;gap:2px;color:var(--muted)}
.verdict{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-family:var(--display);font-weight:700;font-size:1.35rem;padding:12px 16px;border-radius:12px}
.verdict small{font-family:var(--mono);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;font-weight:500;opacity:.8}
.verdict.correct{background:var(--good-soft);color:var(--good)} .verdict.almost{background:var(--warn-soft);color:var(--warn)} .verdict.incorrect{background:var(--bad-soft);color:var(--bad)}
.verdict.grading{background:var(--accent-soft);color:var(--accent);font-size:1.05rem}
.verdict .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);animation:pulse 1s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@media (prefers-reduced-motion: reduce){.verdict .dot{animation:none}}
.confirm{background:var(--warn-soft);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}

/* Progreso */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile .n{font-family:var(--display);font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .l{font-size:.78rem;color:var(--muted)}
.chart svg{width:100%;height:auto;display:block}
.errs{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.errs li{display:grid;grid-template-columns:2.2rem 1fr;gap:8px;align-items:start}
.errs .c{font-family:var(--mono);color:var(--bad);font-weight:500;text-align:right}
.prow{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.prow .stats{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--muted)}
.prow .stats b{color:var(--ink);font-family:var(--mono);font-weight:500}

/* Frases */
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:8px 14px;font-weight:700;font-size:.88rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.item{border-top:1px solid var(--line);padding:10px 0;display:flex;flex-direction:column;gap:2px;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.item .en{color:var(--muted)}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:700;font-size:.9rem}
label.f input,label.f textarea,label.f select{border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 12px;font-weight:400;font-size:1rem;width:100%}
label.f textarea{min-height:76px;resize:vertical}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom, 0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:.92rem;z-index:9;max-width:calc(100% - 32px)}
.empty{text-align:center;padding:40px 10px;color:var(--muted)}
@media (prefers-reduced-motion: no-preference){ .es-card{animation:rise .22s ease-out} @keyframes rise{from{transform:translateY(6px)}to{transform:none}} }
</style>
</head>

<script>
"use strict";
const INTERVAL = [0,1,2,4,7,15,30];
const SESSION_SIZE = 20;
const LS_KEY = "drills-ingles-v1", CFG_KEY = "drills-ingles-cfg";
const SR = window.SpeechRecognition || window.webkitSpeechRecognition || null;
const SEED = {"patterns": [{"id": "as-as", "name": "Igualdad — as … as", "level": 5, "order": 10, "rule": "tan ___ como = as ___ as. No «so ___ like».", "relatedTo": ["comp-short", "comp-long"], "items": [{"id": "as-as-001", "es": "Esta cerveza es tan buena como la otra.", "accepted": ["This beer is as good as the other.", "This beer is as good as the other one."], "hint": "as good as", "ruleShort": "tan buena como = as good as.", "tag": "7"}, {"id": "as-as-002", "es": "El italiano es tan difícil como el inglés.", "accepted": ["Italian is as difficult as English.", "Italian is as hard as English."], "hint": "as difficult as", "ruleShort": "Idiomas sin «the». as difficult as.", "tag": "7"}, {"id": "as-as-003", "es": "Hoy está tan caliente como ayer.", "accepted": ["Today it's as hot as yesterday.", "It's as hot today as yesterday.", "It's as hot today as it was yesterday."], "hint": "as hot as", "ruleShort": "Clima con «it»: it's as hot as.", "tag": "7"}, {"id": "as-as-004", "es": "Ella es tan rápida como él.", "accepted": ["She's as fast as him.", "She's as fast as he is."], "hint": "as fast as", "ruleShort": "as fast as him / as he is.", "tag": "7"}, {"id": "as-as-005", "es": "Dormir es tan importante como hacer ejercicio.", "accepted": ["Sleeping is as important as exercising.", "Sleep is as important as exercise."], "hint": "Sleeping", "ruleShort": "Verbo como sujeto = -ing: sleeping, exercising.", "tag": "13"}, {"id": "as-as-006", "es": "No es tan difícil como parece.", "accepted": ["It's not as difficult as it seems.", "It isn't as difficult as it seems.", "It's not as hard as it seems."], "hint": "it seems", "ruleShort": "not as ___ as. Sujeto también en «it seems».", "tag": "7"}, {"id": "as-as-007", "es": "No es tan lejos como pensé.", "accepted": ["It's not as far as I thought.", "It isn't as far as I thought."], "hint": "as far as", "ruleShort": "as far as I thought.", "tag": "7"}, {"id": "as-as-008", "es": "Este lugar es tan bueno como el otro.", "accepted": ["This place is as good as the other.", "This place is as good as the other one."], "hint": "as good as", "ruleShort": "tan bueno como = as good as.", "tag": "7"}, {"id": "as-as-009", "es": "Para mí, dormir es tan importante como hacer ejercicio.", "accepted": ["For me, sleeping is as important as exercising."], "hint": "For me", "ruleShort": "Para mí = For me. -ing como sujeto.", "tag": "13"}, {"id": "as-as-010", "es": "Esta cerveza es tan fría como la del bar.", "accepted": ["This beer is as cold as the one at the bar."], "hint": "the one", "ruleShort": "la del bar = the one at the bar.", "tag": "7"}]}, {"id": "comp-long", "name": "Comparativo — adjetivos largos", "level": 5, "order": 7, "rule": "Adjetivos de 3+ sílabas: more ___ than (no -er).", "relatedTo": ["comp-short", "superlative-long", "as-as"], "items": [{"id": "comp-long-001", "es": "Esta cerveza es más interesante que la otra.", "accepted": ["This beer is more interesting than the other.", "This beer is more interesting than the other one."], "hint": "more interesting", "ruleShort": "interesting → more interesting.", "tag": "28"}, {"id": "comp-long-002", "es": "El inglés es más complicado que el italiano.", "accepted": ["English is more complicated than Italian."], "hint": "more complicated", "ruleShort": "Idiomas sin «the». more complicated.", "tag": "5"}, {"id": "comp-long-003", "es": "Ella es más organizada que yo.", "accepted": ["She's more organized than me.", "She's more organized than I am."], "hint": "more organized", "ruleShort": "organized → more organized.", "tag": "28"}, {"id": "comp-long-004", "es": "Este problema es más importante que el otro.", "accepted": ["This problem is more important than the other.", "This problem is more important than the other one."], "hint": "more important", "ruleShort": "important → more important.", "tag": "28"}, {"id": "comp-long-005", "es": "La reunión fue más aburrida que la anterior.", "accepted": ["The meeting was more boring than the last one."], "hint": "more boring", "ruleShort": "boring → more boring. la anterior = the last one.", "tag": "28"}, {"id": "comp-long-006", "es": "Este camino es más peligroso que el otro.", "accepted": ["This road is more dangerous than the other.", "This road is more dangerous than the other one."], "hint": "more dangerous", "ruleShort": "dangerous → more dangerous.", "tag": "28"}, {"id": "comp-long-007", "es": "Esta semana fue más productiva que la pasada.", "accepted": ["This week was more productive than last week."], "hint": "more productive", "ruleShort": "la pasada = last week (sin «the»).", "tag": "28"}, {"id": "comp-long-008", "es": "Esta receta es más complicada que la anterior.", "accepted": ["This recipe is more complicated than the last one."], "hint": "more complicated", "ruleShort": "complicated → more complicated.", "tag": "28"}, {"id": "comp-long-009", "es": "Este hotel es más caro que el otro.", "accepted": ["This hotel is more expensive than the other.", "This hotel is more expensive than the other one."], "hint": "more expensive", "ruleShort": "caro = expensive → more expensive.", "tag": "28"}, {"id": "comp-long-010", "es": "Tamarindo es más famoso que mi pueblo.", "accepted": ["Tamarindo is more famous than my town."], "hint": "more famous", "ruleShort": "famous (2 sílabas, no termina en -y) → more famous.", "tag": "28"}]}, {"id": "comp-short", "name": "Comparativo — adjetivos cortos", "level": 5, "order": 6, "rule": "más ___ que = ___er than. Adjetivos en -ed usan «more» (more tired).", "relatedTo": ["comp-long", "superlative-short", "as-as"], "items": [{"id": "comp-short-001", "es": "Mi cerveza es más fría que la tuya.", "accepted": ["My beer is colder than yours."], "hint": "colder", "ruleShort": "cold → colder (adjetivo corto, -er).", "tag": "27"}, {"id": "comp-short-002", "es": "Este bar es más grande que el otro.", "accepted": ["This bar is bigger than the other.", "This bar is bigger than the other one."], "hint": "bigger", "ruleShort": "big → bigger (se dobla la g).", "tag": "27"}, {"id": "comp-short-003", "es": "Hoy estoy más cansado que ayer.", "accepted": ["Today I'm more tired than yesterday.", "I'm more tired today than yesterday."], "hint": "more tired", "ruleShort": "Adjetivos en -ed usan more: more tired.", "tag": "28"}, {"id": "comp-short-004", "es": "Ella es más rápida que yo.", "accepted": ["She's faster than me.", "She's faster than I am."], "hint": "faster", "ruleShort": "fast → faster. than me.", "tag": "27"}, {"id": "comp-short-005", "es": "El lunes fue más largo que el martes.", "accepted": ["Monday was longer than Tuesday."], "hint": "longer", "ruleShort": "long → longer.", "tag": "27"}, {"id": "comp-short-006", "es": "Esta calle es más ancha que la otra.", "accepted": ["This street is wider than the other.", "This street is wider than the other one."], "hint": "wider", "ruleShort": "wide → wider.", "tag": "27"}, {"id": "comp-short-007", "es": "Mi hermano es mayor que yo.", "accepted": ["My brother is older than me.", "My brother is older than I am."], "hint": "older", "ruleShort": "mayor (edad) = older.", "tag": "27"}, {"id": "comp-short-008", "es": "El agua está más caliente que ayer.", "accepted": ["The water is hotter than yesterday.", "The water is hotter than it was yesterday."], "hint": "hotter", "ruleShort": "hot → hotter (se dobla la t).", "tag": "27"}, {"id": "comp-short-009", "es": "Este ejercicio es más duro que el anterior.", "accepted": ["This workout is harder than the last one.", "This exercise is harder than the last one."], "hint": "harder", "ruleShort": "hard → harder. el anterior = the last one.", "tag": "27"}, {"id": "comp-short-010", "es": "Costa Rica es más pequeña que Venezuela.", "accepted": ["Costa Rica is smaller than Venezuela."], "hint": "smaller", "ruleShort": "small → smaller.", "tag": "27"}, {"id": "comp-short-011", "es": "Mi casa es más grande que la de mi hermano.", "accepted": ["My house is bigger than my brother's."], "hint": "brother's", "ruleShort": "la de mi hermano = my brother's.", "tag": "17"}, {"id": "comp-short-012", "es": "Este café está más fuerte que el de ayer.", "accepted": ["This coffee is stronger than yesterday's."], "hint": "stronger", "ruleShort": "el de ayer = yesterday's. strong → stronger.", "tag": "17"}, {"id": "comp-short-013", "es": "Estoy más cansado que esta mañana.", "accepted": ["I'm more tired than this morning.", "I'm more tired than I was this morning."], "hint": "more tired", "ruleShort": "tired (-ed) → more tired.", "tag": "28"}, {"id": "comp-short-014", "es": "Él es más alto que su papá.", "accepted": ["He's taller than his dad.", "He's taller than his father."], "hint": "taller", "ruleShort": "alto (persona) = tall → taller.", "tag": "27"}]}, {"id": "continuous-future", "name": "Presente continuo y going to", "level": 3, "order": 3, "rule": "Presente continuo = am/is/are + -ing. «pensar en» = think about + -ing. Planes = going to.", "relatedTo": ["present-simple", "past-simple"], "items": [{"id": "continuous-future-001", "es": "Estoy aprendiendo inglés.", "accepted": ["I'm learning English."], "hint": "learning", "ruleShort": "am / is / are + -ing.", "tag": "22"}, {"id": "continuous-future-002", "es": "Ella está cocinando.", "accepted": ["She's cooking."], "hint": "cooking", "ruleShort": "she is + -ing.", "tag": "22"}, {"id": "continuous-future-003", "es": "No estoy trabajando hoy.", "accepted": ["I'm not working today."], "hint": "not working", "ruleShort": "Negativo: am not + -ing.", "tag": "22"}, {"id": "continuous-future-004", "es": "¿Qué estás haciendo?", "accepted": ["What are you doing?"], "hint": "doing", "ruleShort": "Pregunta: What are you + -ing?", "tag": "22"}, {"id": "continuous-future-005", "es": "Estamos buscando un lugar nuevo.", "accepted": ["We're looking for a new place."], "hint": "looking for", "ruleShort": "buscar = look for (con «for»).", "tag": "22"}, {"id": "continuous-future-006", "es": "Voy a viajar a Italia el próximo año.", "accepted": ["I'm going to travel to Italy next year."], "hint": "going to", "ruleShort": "Planes: be going to + verbo. next year sin «the».", "tag": "23"}, {"id": "continuous-future-007", "es": "No voy a ir a la fiesta.", "accepted": ["I'm not going to go to the party.", "I'm not going to the party."], "hint": "not going", "ruleShort": "Negativo: I'm not going to + verbo.", "tag": "23"}, {"id": "continuous-future-008", "es": "Ella va a tener un bebé.", "accepted": ["She's going to have a baby."], "hint": "have", "ruleShort": "she's going to + verbo base.", "tag": "23"}, {"id": "continuous-future-009", "es": "¿Vas a comer algo?", "accepted": ["Are you going to eat something?", "Are you going to eat anything?"], "hint": "Are", "ruleShort": "Pregunta: Are you going to + verbo?", "tag": "23"}, {"id": "continuous-future-010", "es": "Voy a llamar al proveedor mañana.", "accepted": ["I'm going to call the supplier tomorrow."], "hint": "supplier", "ruleShort": "proveedor = supplier (no provider).", "tag": "16"}, {"id": "continuous-future-011", "es": "Estoy tratando de dormir más.", "accepted": ["I'm trying to sleep more."], "hint": "trying", "ruleShort": "try + to + verbo.", "tag": "1"}, {"id": "continuous-future-012", "es": "Estoy pensando en cambiar de carro.", "accepted": ["I'm thinking about changing my car.", "I'm thinking about changing cars.", "I'm thinking about getting a new car."], "hint": "thinking about", "ruleShort": "think about + -ing: changing.", "tag": "8"}, {"id": "continuous-future-013", "es": "Él está esperando afuera.", "accepted": ["He's waiting outside."], "hint": "waiting", "ruleShort": "he is + -ing.", "tag": "22"}, {"id": "continuous-future-014", "es": "Vamos a necesitar más malta.", "accepted": ["We're going to need more malt."], "hint": "need", "ruleShort": "we're going to + verbo.", "tag": "23"}, {"id": "continuous-future-015", "es": "¿Vas a quedarte o vas a irte?", "accepted": ["Are you going to stay or leave?", "Are you going to stay or go?"], "hint": "leave", "ruleShort": "irse = leave.", "tag": "16"}, {"id": "continuous-future-016", "es": "Estoy leyendo un libro muy bueno.", "accepted": ["I'm reading a very good book."], "hint": "reading", "ruleShort": "am + -ing. El adjetivo va antes del libro.", "tag": "22"}, {"id": "continuous-future-017", "es": "No voy a tomar café después de las dos.", "accepted": ["I'm not going to drink coffee after two.", "I'm not going to have coffee after two."], "hint": "drink", "ruleShort": "tomar (bebida) = drink / have.", "tag": "23"}, {"id": "continuous-future-018", "es": "Estamos creciendo mucho como empresa.", "accepted": ["We're growing a lot as a company."], "hint": "as a company", "ruleShort": "como (en calidad de) = as a.", "tag": "5"}, {"id": "continuous-future-019", "es": "Estoy pensando en tomar clases de surf.", "accepted": ["I'm thinking about taking surfing classes.", "I'm thinking about taking surf lessons.", "I'm thinking about taking surfing lessons.", "I'm thinking about taking surf classes."], "hint": "taking", "ruleShort": "think about + -ing: taking.", "tag": "8"}, {"id": "continuous-future-020", "es": "Voy a intentar hablar solo en inglés hoy.", "accepted": ["I'm going to try to speak only English today.", "I'm going to try to speak only in English today."], "hint": "try to", "ruleShort": "going to + try + to + verbo.", "tag": "23"}]}, {"id": "impersonal-se", "name": "«Se / uno» → sujeto explícito", "level": 3, "order": 4, "rule": "El inglés casi siempre necesita sujeto explícito. «se / uno» → you / we / they / afirmación directa / pasiva.", "relatedTo": ["modals", "present-simple"], "items": [{"id": "impersonal-se-001", "es": "Se dice que el café de Costa Rica es el mejor del mundo.", "accepted": ["They say Costa Rican coffee is the best in the world.", "People say Costa Rican coffee is the best in the world.", "They say that Costa Rican coffee is the best in the world."], "hint": "They say", "ruleShort": "se dice = they say / people say. the best in the world.", "tag": "21"}, {"id": "impersonal-se-002", "es": "Uno nunca sabe qué va a pasar mañana.", "accepted": ["You never know what will happen tomorrow.", "You never know what's going to happen tomorrow."], "hint": "You never", "ruleShort": "uno = you.", "tag": "21"}, {"id": "impersonal-se-003", "es": "Aquí se trabaja mucho, pero también se disfruta la vida.", "accepted": ["Here we work a lot, but we also enjoy life.", "We work a lot here, but we also enjoy life."], "hint": "we", "ruleShort": "se (nosotros) = we. life sin «the».", "tag": "21"}, {"id": "impersonal-se-004", "es": "Se necesita paciencia para aprender un idioma.", "accepted": ["You need patience to learn a language."], "hint": "You need", "ruleShort": "se necesita = you need. para + verbo = to.", "tag": "1"}, {"id": "impersonal-se-005", "es": "Dicen que va a subir el precio de la gasolina.", "accepted": ["They say gas prices are going to go up.", "They say the price of gas is going to go up."], "hint": "go up", "ruleShort": "dicen = they say. subir (un precio) = go up.", "tag": "21"}, {"id": "impersonal-se-006", "es": "Cuando uno llega a Nápoles por primera vez, se siente abrumado.", "accepted": ["When you arrive in Naples for the first time, you feel overwhelmed."], "hint": "arrive in", "ruleShort": "llegar a una ciudad = arrive in.", "tag": "6"}, {"id": "impersonal-se-007", "es": "En mi empresa se fabrican cervezas artesanales.", "accepted": ["In my brewery, we brew craft beers.", "At my brewery, we brew craft beer.", "In my brewery, we brew craft beer.", "At my brewery, we brew craft beers."], "hint": "brew", "ruleShort": "se fabrican (nosotros) = we brew / we make.", "tag": "21"}, {"id": "impersonal-se-008", "es": "No se puede fumar adentro del restaurante.", "accepted": ["You can't smoke inside the restaurant."], "hint": "can't", "ruleShort": "no se puede = you can't.", "tag": "21"}, {"id": "impersonal-se-009", "es": "Se come muy bien en Costa Rica.", "accepted": ["You eat very well in Costa Rica.", "The food is very good in Costa Rica."], "hint": "well", "ruleShort": "comer bien = eat well (adverbio, no good).", "tag": "12"}, {"id": "impersonal-se-010", "es": "Uno se acostumbra al calor después de un tiempo.", "accepted": ["You get used to the heat after a while."], "hint": "get used to", "ruleShort": "acostumbrarse a = get used to.", "tag": "21"}, {"id": "impersonal-se-011", "es": "Se canceló la reunión de mañana.", "accepted": ["Tomorrow's meeting was canceled.", "Tomorrow's meeting was cancelled.", "Tomorrow's meeting has been canceled."], "hint": "canceled", "ruleShort": "Pasiva: was + participio. de mañana = tomorrow's.", "tag": "32"}, {"id": "impersonal-se-012", "es": "Aquí no se acepta efectivo, solo tarjeta.", "accepted": ["We don't accept cash, only card.", "We don't accept cash here, only cards.", "We don't accept cash here, only card."], "hint": "accept", "ruleShort": "aceptar pagos = accept (no receive).", "tag": "16"}, {"id": "impersonal-se-013", "es": "Cuando uno tiene hijos, se cambia la perspectiva.", "accepted": ["When you have children, your perspective changes.", "When you have kids, your perspective changes."], "hint": "changes", "ruleShort": "your perspective changes: tercera persona con -s.", "tag": "2"}, {"id": "impersonal-se-014", "es": "Se venden muchas cervezas artesanales en Tamarindo.", "accepted": ["There are a lot of craft beers in Tamarindo.", "They sell a lot of craft beers in Tamarindo.", "A lot of craft beers are sold in Tamarindo."], "hint": "a lot of", "ruleShort": "a lot of + sustantivo (siempre con «of»).", "tag": "14"}, {"id": "impersonal-se-015", "es": "Dicen que el ejercicio mejora la memoria.", "accepted": ["Exercise improves memory.", "They say exercise improves memory.", "They say that exercise improves memory."], "hint": "improves", "ruleShort": "Conceptos generales sin «the»; improves con -s.", "tag": "5"}, {"id": "impersonal-se-016", "es": "No se puede estacionar aquí.", "accepted": ["You can't park here."], "hint": "park", "ruleShort": "no se puede = you can't.", "tag": "21"}, {"id": "impersonal-se-017", "es": "Uno se da cuenta con el tiempo de lo que importa.", "accepted": ["You realize what matters over time.", "Over time, you realize what matters."], "hint": "realize", "ruleShort": "darse cuenta = realize. what matters (con -s).", "tag": "2"}, {"id": "impersonal-se-018", "es": "Se abre la fábrica a las 6 de la mañana.", "accepted": ["The brewery opens at 6 AM.", "The brewery opens at 6 in the morning.", "The factory opens at 6 AM.", "The factory opens at 6 in the morning."], "hint": "opens", "ruleShort": "Sujeto explícito + opens (-s). La hora con «at».", "tag": "2"}, {"id": "impersonal-se-019", "es": "Se nota que has estado entrenando.", "accepted": ["You can tell you've been training.", "You can tell that you've been training."], "hint": "can tell", "ruleShort": "se nota = you can tell. has estado + -ndo = have been + -ing.", "tag": "10"}, {"id": "impersonal-se-020", "es": "Uno no puede controlar todo en la vida.", "accepted": ["You can't control everything in life."], "hint": "control", "ruleShort": "uno no puede = you can't. in life, sin «the».", "tag": "5"}, {"id": "impersonal-se-021", "es": "Aquí se respira aire puro.", "accepted": ["You can breathe fresh air here.", "Here you can breathe fresh air.", "You breathe fresh air here."], "hint": "breathe", "ruleShort": "aire puro = fresh air.", "tag": "21"}, {"id": "impersonal-se-022", "es": "Cuando uno emprende, se aprende a fallar.", "accepted": ["When you run a business, you learn to fail.", "When you start a business, you learn to fail."], "hint": "run a business", "ruleShort": "emprender = run / start a business. learn + to.", "tag": "1"}, {"id": "impersonal-se-023", "es": "Se me olvidó comprar la malta.", "accepted": ["I forgot to buy the malt."], "hint": "forgot", "ruleShort": "se me olvidó = I forgot (sujeto: I).", "tag": "11"}, {"id": "impersonal-se-024", "es": "Se tarda como una hora en llegar a Tamarindo.", "accepted": ["It takes about an hour to get to Tamarindo."], "hint": "takes", "ruleShort": "tardar = it takes + tiempo + to. an hour (h muda).", "tag": "29"}, {"id": "impersonal-se-025", "es": "Dicen que dormir bien es más importante que el ejercicio.", "accepted": ["They say sleeping well is more important than exercise.", "They say sleeping well is more important than exercising.", "They say that sleeping well is more important than exercise."], "hint": "sleeping", "ruleShort": "Verbo como sujeto = -ing: sleeping well.", "tag": "13"}, {"id": "impersonal-se-026", "es": "Uno se siente orgulloso cuando la cerveza queda bien.", "accepted": ["You feel proud when the beer turns out well.", "You feel proud when the beer turns out good."], "hint": "turns out", "ruleShort": "quedar bien (resultado) = turn out well.", "tag": "12"}, {"id": "impersonal-se-027", "es": "No se permiten mascotas en el restaurante.", "accepted": ["Pets are not allowed in the restaurant.", "Pets aren't allowed in the restaurant.", "No pets allowed in the restaurant."], "hint": "allowed", "ruleShort": "Pasiva: are not allowed.", "tag": "32"}]}, {"id": "modals", "name": "Modales", "level": 4, "order": 5, "rule": "can + verbo sin «to». «tanto» = so much. «alguien más» = someone else. «yo invito» = it's on me.", "relatedTo": ["impersonal-se", "continuous-future"], "items": [{"id": "modals-001", "es": "Tengo que levantarme temprano mañana.", "accepted": ["I have to wake up early tomorrow.", "I have to get up early tomorrow."], "hint": "have to", "ruleShort": "tener que = have to.", "tag": "25"}, {"id": "modals-002", "es": "No tienes que pagar, yo invito.", "accepted": ["You don't have to pay, it's on me."], "hint": "it's on me", "ruleShort": "yo invito = it's on me. no tener que = don't have to.", "tag": "16"}, {"id": "modals-003", "es": "Necesito aprender a manejar mis tiempos.", "accepted": ["I need to learn to manage my time.", "I need to learn how to manage my time."], "hint": "manage", "ruleShort": "need to + verbo; learn to + verbo. time no lleva -s.", "tag": "1"}, {"id": "modals-004", "es": "Puedo cocinar pero no muy bien.", "accepted": ["I can cook but not very well."], "hint": "well", "ruleShort": "can + verbo sin «to». bien = well.", "tag": "24"}, {"id": "modals-005", "es": "Ella puede hablar tres idiomas.", "accepted": ["She can speak three languages."], "hint": "can speak", "ruleShort": "can no lleva -s: she can speak.", "tag": "24"}, {"id": "modals-006", "es": "No puedo dormir cuando hace calor.", "accepted": ["I can't sleep when it's hot."], "hint": "it's hot", "ruleShort": "Clima con «it»: when it's hot.", "tag": "18"}, {"id": "modals-007", "es": "Deberías probar mi cerveza.", "accepted": ["You should try my beer."], "hint": "should", "ruleShort": "deberías = should + verbo.", "tag": "24"}, {"id": "modals-008", "es": "No deberías tomar tanto café.", "accepted": ["You shouldn't drink so much coffee.", "You shouldn't drink that much coffee.", "You shouldn't drink too much coffee."], "hint": "so much", "ruleShort": "tanto + incontable = so much.", "tag": "15"}, {"id": "modals-009", "es": "¿Puedes hablar más despacio?", "accepted": ["Can you speak more slowly?", "Could you speak more slowly?"], "hint": "slowly", "ruleShort": "despacio = slowly (adverbio).", "tag": "12"}, {"id": "modals-010", "es": "Tengo que ir al banco antes de que cierre.", "accepted": ["I have to go to the bank before it closes."], "hint": "closes", "ruleShort": "it + verbo con -s: closes.", "tag": "2"}, {"id": "modals-011", "es": "No necesitas experiencia para este trabajo.", "accepted": ["You don't need experience for this job.", "You don't need any experience for this job."], "hint": "experience", "ruleShort": "for + sustantivo: for this job.", "tag": "1"}, {"id": "modals-012", "es": "Podemos reunirnos el viernes.", "accepted": ["We can meet on Friday."], "hint": "on Friday", "ruleShort": "Días de la semana con «on».", "tag": "6"}, {"id": "modals-013", "es": "Deberías hacer ejercicio más seguido.", "accepted": ["You should exercise more often.", "You should work out more often."], "hint": "often", "ruleShort": "más seguido = more often.", "tag": "24"}, {"id": "modals-014", "es": "No puedo encontrar un buen proveedor.", "accepted": ["I can't find a good supplier."], "hint": "supplier", "ruleShort": "proveedor = supplier.", "tag": "16"}, {"id": "modals-015", "es": "Tienes que ver esa película.", "accepted": ["You have to watch that movie.", "You have to see that movie."], "hint": "watch", "ruleShort": "tener que = have to.", "tag": "25"}, {"id": "modals-016", "es": "Necesitamos contratar a alguien más.", "accepted": ["We need to hire someone else."], "hint": "someone else", "ruleShort": "alguien más = someone else.", "tag": "16"}, {"id": "modals-017", "es": "¿Puedo sentarme aquí?", "accepted": ["Can I sit here?", "May I sit here?"], "hint": "sit", "ruleShort": "can + verbo sin «to».", "tag": "24"}, {"id": "modals-018", "es": "No tienes que venir si no quieres.", "accepted": ["You don't have to come if you don't want to."], "hint": "want to", "ruleShort": "Se cierra con «to»: if you don't want to.", "tag": "25"}, {"id": "modals-019", "es": "Quiero poder hablar inglés sin pensar.", "accepted": ["I want to be able to speak English without thinking."], "hint": "be able to", "ruleShort": "poder (después de otro verbo) = be able to. without + -ing.", "tag": "24"}, {"id": "modals-020", "es": "Debería dormir más pero no puedo.", "accepted": ["I should sleep more but I can't."], "hint": "should", "ruleShort": "should + verbo. Cierre corto: but I can't.", "tag": "24"}]}, {"id": "opinion", "name": "Opinar", "level": 5, "order": 11, "rule": "I think / I don't think + sujeto. «me parece bien» = sounds good. Verbo como sujeto = -ing.", "relatedTo": ["comp-short", "comp-long"], "items": [{"id": "opinion-001", "es": "Creo que tienes razón.", "accepted": ["I think you're right.", "I think you are right."], "hint": "right", "ruleShort": "tener razón = be right.", "tag": "36"}, {"id": "op     const f1 = pickItems(focus, 1, used)[0]; if(f1) mixed.push({i:f1.id,p:focus,k:"mixed"});
    const ps = shuffle([...pool]);
    for(let j=0; mixed.length<3 && j<6; j++){ const pid = ps[j % ps.length]; const it = pickItems(pid,1,used)[0]; if(it) mixed.push({i:it.id,p:pid,k:"mixed"}); }
  }
  return {focus, plan:[...focusItems, ...reviews, ...shuffle(mixed)]};
}

/* ---------- comparación tolerante ---------- */
const CONTR = {"i'm":"i am","you're":"you are","we're":"we are","they're":"they are","it's":"it is","he's":"he is","she's":"she is","that's":"that is","what's":"what is","there's":"there is","where's":"where is","who's":"who is","here's":"here is","let's":"let us","i've":"i have","you've":"you have","we've":"we have","they've":"they have","i'd":"i would","you'd":"you would","we'd":"we would","they'd":"they would","he'd":"he would","she'd":"she would","i'll":"i will","you'll":"you will","we'll":"we will","they'll":"they will","it'll":"it will","he'll":"he will","she'll":"she will","don't":"do not","doesn't":"does not","didn't":"did not","isn't":"is not","aren't":"are not","wasn't":"was not","weren't":"were not","can't":"can not","cannot":"can not","couldn't":"could not","shouldn't":"should not","wouldn't":"would not","won't":"will not","haven't":"have not","hasn't":"has not","hadn't":"had not"};
for(const k of ["i'm","you're","they're","that's","what's","there's","where's","i've","you've","we've","they've","i'll","you'll","they'll","don't","doesn't","didn't","isn't","aren't","wasn't","weren't","can't","couldn't","shouldn't","wouldn't","haven't","hasn't"]) CONTR[k.replace("'","")] = CONTR[k];
const NUMS = {"1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve"};
const ALIAS = {"cancelled":"canceled","mum":"mom","ok":"okay","colour":"color","favourite":"favorite","organised":"organized","realise":"realize"};
function baseNorm(s){
  return String(s||"").normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase()
    .replace(/[’‘`´]/g,"'").replace(/\ba\.m\./g,"am").replace(/\bp\.m\./g,"pm")
    .replace(/[^a-z0-9' ]+/g," ").replace(/\s+/g," ").trim();
}
function norm(s){
  return baseNorm(s).split(" ").filter(Boolean)
    .map(w=>w.replace(/^'+|'+$/g,"")).filter(Boolean)
    .flatMap(w=>(CONTR[w] || NUMS[w] || ALIAS[w] || w).split(" "));
}
function lcs(a,b){
  const m=a.length, n=b.length, d=Array.from({length:m+1},()=>new Array(n+1).fill(0));
  for(let i=m-1;i>=0;i--) for(let j=n-1;j>=0;j--) d[i][j] = a[i]===b[j] ? d[i+1][j+1]+1 : Math.max(d[i+1][j], d[i][j+1]);
  const ma=new Set(), mb=new Set(); let i=0,j=0;
  while(i<m && j<n){ if(a[i]===b[j]){ ma.add(i); mb.add(j); i++; j++; } else if(d[i+1][j]>=d[i][j+1]) i++; else j++; }
  return {len:d[0][0], ma, mb};
}
function gradeAnswer(ans, accepted){
  const u = norm(ans);
  if(!u.length) return {suggest:"incorrect", best:accepted[0], score:0};
  let best = {score:-1, a:accepted[0]};
  for(const a of accepted){
    const t = norm(a);
    const same = u.join(" ")===t.join(" ") || u.filter(w=>w!=="that").join(" ")===t.filter(w=>w!=="that").join(" ");
    const score = same ? 1 : (2*lcs(u,t).len)/(u.length+t.length);
    if(score>best.score) best = {score, a};
  }
  return {suggest: best.score===1 ? "correct" : best.score>=0.75 ? "almost" : "incorrect", best:best.a, score:best.score};
}
function diffHtml(ans, target){
  const ua = String(ans).trim().split(/\s+/).filter(Boolean), ta = String(target).trim().split(/\s+/).filter(Boolean);
  const key = w => norm(w).join(" ");
  const r = lcs(ua.map(key), ta.map(key));
  return {
    user: ua.map((w,i)=> r.ma.has(i) ? esc(w) : `<span class="x">${esc(w)}</span>`).join(" "),
    target: ta.map((w,j)=> r.mb.has(j) ? esc(w) : `<span class="miss">${esc(w)}</span>`).join(" ")
  };
}

const MODEL_FALLBACKS = ["gemini-flash-lite-latest","gemini-3.5-flash-lite","gemini-flash-latest","gemini-3.8-flash"];
async function geminiOnce(model, prompt, signal){
  const url = "https://generativelanguage.googleapis.com/v1beta/models/" + encodeURIComponent(model) + ":generateContent";
  const res = await fetch(url, {method:"POST", signal, headers:{"Content-Type":"application/json", "x-goog-api-key":S.cfg.key.trim()},
    body:JSON.stringify({contents:[{role:"user", parts:[{text:prompt}]}], generationConfig:{temperature:0.2, responseMimeType:"application/json", maxOutputTokens:300}})});
  if(!res.ok){
    let detail = ""; try{ detail = (await res.json())?.error?.message || ""; }catch{}
    const err = new Error(detail || ("error " + res.status)); err.status = res.status; throw err;
  }
  const j = await res.json();
  const text = (j.candidates?.[0]?.content?.parts || []).map(p=>p.text||"").join("");
  const m = text.match(/\{[\s\S]*\}/);
  if(!m){ const err = new Error("sin JSON"); err.status = 0; throw err; }
  return JSON.parse(m[0]);
}
const BAD_KEY = e => (e?.status===400 && /API key/i.test(e.message)) || e?.status===403;
async function gemini(prompt, signal){
  const first = S.cfg.model.trim();
  const chain = [first, ...MODEL_FALLBACKS.filter(m=>m!==first)];
  const errors = [];
  // Carrera entre los dos primeros modelos: gana el que responda antes.
  const ctl = new AbortController();
  const onAbort = () => ctl.abort();
  signal?.addEventListener("abort", onAbort);
  try{
    const win = await Promise.any(chain.slice(0,2).map(m => geminiOnce(m, prompt, ctl.signal)));
    ctl.abort(); return win;
  }catch(agg){
    if(signal?.aborted){ const e = new Error("cancelled"); e.name = "AbortError"; throw e; }
    for(const e of (agg?.errors || [])){ errors.push(e); if(BAD_KEY(e)) throw new Error("La clave de Gemini no es válida. Revísala en Ajustes."); }
  }finally{ signal?.removeEventListener("abort", onAbort); }
  // Respaldo en secuencia con el resto.
  for(const model of chain.slice(2)){
    try{ return await geminiOnce(model, prompt, signal); }
    catch(e){
      if(e?.name==="AbortError") throw e;
      errors.push(e);
      if(BAD_KEY(e)) throw new Error("La clave de Gemini no es válida. Revísala en Ajustes.");
    }
  }
  const last = errors[errors.length-1];
  if(errors.some(e=>e.status===429)) throw new Error("Gemini llegó a su límite gratuito por ahora; se usa la comparación automática.");
  if(errors.some(e=>e.status===503)) throw new Error("Gemini está saturado en este momento; se usa la comparación automática.");
  throw new Error("Gemini no respondió" + (last?.message ? " (" + String(last.message).slice(0,80) + ")" : "") + "; se usa la comparación automática.");
}
async function askClaude(it, step, d){
  const p = S.patterns[step.p];
  const prompt = `Eres profesor de inglés de un hispanohablante adulto de nivel básico. Evalúa su traducción.
Frase en español: «${it.es}»
Respuesta del alumno: «${d.answer.trim()}»
Respuestas de referencia:
${it.accepted.map(a=>"- "+a).join("\n")}
Patrón que se practica: ${p?.name||""}. Regla: ${p?.rule||""}

Criterios:
- "correct": inglés correcto y natural que dice lo mismo que la frase en español, aunque no coincida con las referencias. Ignora mayúsculas, puntuación, tildes y contracciones.
- "almost": se entiende y la estructura general es la buena, pero hay un error de gramática, preposición, artículo, orden o una palabra mal elegida.
- "incorrect": estructura equivocada, significado distinto, palabras en español, o no usa el patrón que la frase pide.
No cuentes como error una variante válida (por ejemplo "that" opcional, "movie/film", "restroom/bathroom").

Responde solo con este JSON:
{"verdict":"correct|almost|incorrect","corrected":"la versión correcta más cercana a lo que escribió el alumno","explanation":"una sola oración en español, sencilla y concreta, que nombre el error principal y cómo se dice bien; cadena vacía si es correct","valid":true si la respuesta del alumno es correcta tal cual y no coincide con ninguna referencia, false en otro caso}`;
  d.ctl = new AbortController();
  try{
    const r = await gemini(prompt, d.ctl.signal);
    if(S.drill!==d || d.phase!=="feedback") return;
    const v = ["correct","almost","incorrect"].includes(r?.verdict) ? r.verdict : d.res.verdict;
    d.res = {verdict:v, best:String(r?.corrected || d.res.best).trim(), explanation:String(r?.explanation||"").trim(), source:"claude"};
    if(v==="correct" && r?.valid===true && it.id && S.patterns[step.p]){
      const same = a => norm(a).join(" ")===norm(d.answer).join(" ");
      if(!it.accepted.some(same)){
        const pp = clone(S.patterns[step.p]);
        const ii = pp.items.find(x=>x.id===it.id);
        if(ii){ ii.accepted.push(d.answer.trim().replace(/\s+/g," ")); savePattern(pp); d.res.learned = true; }
      }
    }
  }catch(e){
    if(e?.name==="AbortError") return;
    toast(e instanceof TypeError ? "Sin conexión con Gemini; se usa la comparación automática." : (e?.message || "Gemini no respondió; se usa la comparación automática."));
  }
  d.grading = false;
  if(S.drill===d) render();
}
function next(){
  const d = S.drill;
  if(d.grading){ d.ctl?.abort(); d.grading = false; }
  grade(d.res.verdict);
}
function grade(r){
  const d = S.drill, step = currentStep(), cur = S.cur;
  const att = {i:step.i, p:step.p, k:step.k, r, h:d.hint, a:String(d.answer).slice(0,300), x:String(d.res?.explanation||"").slice(0,200), src:d.res?.source||"local", t:Date.now()};
  cur.attempts.push(att);
  const ps = pst(step.p);
  if(ps.status==="new") ps.status = "learning";
  ps.recent.push({r, h:d.hint}); if(ps.recent.length>10) ps.recent.shift();
  if(r==="correct" && !d.hint){ ps.streak.push({d:cur.day, m:step.k==="mixed"}); if(ps.streak.length>40) ps.streak.shift(); }
  else ps.streak = [];
  if(ps.status!=="mastered" && isMastered(ps)){ ps.status="mastered"; ps.masteredAt=Date.now(); (cur.mastered ||= []).push(step.p); toast("¡Patrón dominado! " + (S.patterns[step.p]?.name||"")); }
  const prev = S.state.items[step.i] || {seen:0};
  S.state.items[step.i] = {seen:prev.seen+1, last:r, hint:d.hint, lastDay:cur.day};
  if(cur.attempts.length>=cur.plan.length){ finalize(cur, false); return; }
  saveSession(cur); saveState();
  S.drill = {phase:"answer", hint:false, answer:"", res:null, confirmEnd:false, grading:false};
  render(); focusAns(); window.scrollTo(0,0);
}
function finalize(sess, silent){
  const by = {};
  for(const a of sess.attempts){ const b = by[a.p] ||= {n:0,c:0,ci:0,x:0}; b.n++; if(a.r==="correct"){ b.c++; if(!a.h) b.ci++; } if(a.r==="incorrect") b.x++; }
  const changes = [];
  for(const [pid,b] of Object.entries(by)){
    const ps = pst(pid), before = ps.box;
    if(b.x/b.n >= 0.3) ps.box = Math.max(ps.box-2, 0);
    else if(b.ci/b.n >= 0.8) ps.box = Math.min(ps.box+1, 6);
    ps.nextReviewDay = sess.day + INTERVAL[ps.box];
    changes.push({p:pid, before, after:ps.box, n:b.n, c:b.c});
  }
  sess.done = true; sess.endedAt = Date.now(); sess.changes = changes;
  S.state.focusId = chooseFocus();
  saveSession(sess); saveState();
  if(!silent){ S.view="summary"; S.summary = clone(sess); S.cur=null; render(); window.scrollTo(0,0); }
}

/* ---------- utilidades de reporte ---------- */
function allAttempts(){ return S.sessions.flatMap(s=>s.attempts||[]); }
const WEEK = 7*864e5;
function wkOf(list){ let inc=0,alm=0,h=0; for(const a of list){ if(a.r==="incorrect") inc++; else if(a.r==="almost") alm++; if(a.h) h++; } return list.length ? (inc+alm*0.5+h*0.3)/list.length : 0; }
function weeklyWin(){
  const now = Date.now(), cur = {}, prev = {};
  for(const a of allAttempts()){ const age = now-a.t; const b = age<WEEK ? cur : age<2*WEEK ? prev : null; if(b) (b[a.p] ||= []).push(a); }
  let best = null;
  for(const pid of Object.keys(cur)){
    if(!prev[pid] || cur[pid].length<3 || prev[pid].length<3) continue;
    const d = wkOf(prev[pid]) - wkOf(cur[pid]);
    if(d>0 && (!best || d>best.d)) best = {pid, d, before:accOf(prev[pid]), after:accOf(cur[pid])};
  }
  if(best) return {kind:"drop", ...best};
  const m = Object.entries(S.state.patterns).filter(([,p])=>p.masteredAt && now-p.masteredAt<WEEK).sort((a,b)=>b[1].masteredAt-a[1].masteredAt)[0];
  if(m) return {kind:"mastered", pid:m[0]};
  const n = Object.values(cur).reduce((s,l)=>s+l.length,0);
  return n ? {kind:"count", n} : null;
}
function accOf(list){ return list.length ? Math.round(100*list.filter(a=>a.r==="correct").length/list.length) : 0; }
function winHtml(w){
  if(!w) return "";
  const name = pid => esc(S.patterns[pid]?.name || pid);
  let body;
  if(w.kind==="drop") body = `<h3>${name(w.pid)}</h3><p>Aciertos: <span class="mono">${w.before}% → ${w.after}%</span> frente a la semana pasada. Es el patrón que más mejoró.</p>`;
  else if(w.kind==="mastered") body = `<h3>Dominaste ${name(w.pid)}</h3><p>Tres sesiones seguidas sin fallar y sin pista, incluida una ronda mixta.</p>`;
  else body = `<h3>${w.n} frases producidas esta semana</h3><p>Cuando tengas dos semanas de datos aquí verás qué patrón mejoró más.</p>`;
  return `<section class="panel win"><span class="eyebrow">Micro-victoria de la semana</span>${body}</section>`;
}

}

function renderDrill(app, dock){
  const cur = S.cur, d = S.drill, step = currentStep();
  if(!step){ S.view="home"; return render(); }
  const it = S.itemIdx[step.i] || {es:"(Esta frase se borró del banco)", accepted:[""], hint:"", ruleShort:""};
  const n = cur.attempts.length;
  const segs = cur.plan.map((_,i)=> i<n ? `<span class="${cur.attempts[i].r}"></span>` : i===n ? `<span class="now"></span>` : "<span></span>").join("");
  const pname = S.patterns[step.p]?.name || "";
  const tag = step.k==="mixed" ? `<span class="tag mixed">Ronda mixta</span>` : step.k==="review" ? `<span class="tag review">Repaso · ${esc(pname)}</span>` : `<span class="tag">Foco · ${esc(pname)}</span>`;
  let body = "";
  if(d.phase==="answer"){
    body = `
      <label for="ans" class="eyebrow">${SR ? "Toca Hablar y di la frase en inglés, o escríbela." : "Escribe la frase en inglés."}</label>
      <textarea id="ans" autocomplete="off" autocapitalize="sentences" spellcheck="false" placeholder="Tu frase en inglés">${esc(d.answer)}</textarea>`;
    dock.innerHTML = `<div class="dock-in">
      <button class="btn" data-act="hint" ${d.hint||!it.hint?"disabled":""}>Pista</button>
      ${SR ? `<button id="micbtn" class="btn primary mic ${S.listening?"listening":""}" data-act="mic" style="flex:2">${MIC}<span>${S.listening?"Escuchando…":"Hablar"}</span></button>` : ""}
      <button class="btn ${SR?"":"primary"}" data-act="check" style="flex:${SR?1:2}">Comprobar</button></div>`;
  } else if(d.grading){
    body = `
      <section class="fb">
        <div class="stack" style="gap:2px"><span class="eyebrow">Tu respuesta</span><p class="line">${esc(d.answer)}</p></div>
        <div class="verdict grading"><span class="dot"></span>Revisando con Gemini…</div>
      </section>`;
    dock.innerHTML = `<div class="dock-in"><button class="btn big" data-act="next">Saltar la revisión</button></div>`;
  } else {
    const r = d.res, target = r.best || it.accepted[0];
    const df = r.verdict==="correct" ? {user:esc(d.answer), target:esc(target)} : diffHtml(d.answer, target);
    const others = it.accepted.filter(a=>norm(a).join(" ")!==norm(target).join(" ") && norm(a).join(" ")!==norm(d.answer).join(" "));
    const label = {correct:"Correcto", almost:"Casi", incorrect:"Incorrecto"}[r.verdict];
    const expl = r.explanation || (r.verdict==="correct" ? (r.learned ? "Bien dicho. Guardé tu versión como respuesta válida para esta frase." : "") : (it.ruleShort || S.patterns[step.p]?.rule || ""));
    body = `
      <section class="fb">
        <div class="verdict ${r.verdict}">${label}${r.source==="local" ? '<small>comparación automática</small>' : ""}</div>
        <div class="stack" style="gap:2px"><span class="eyebrow">Tu respuesta</span><p class="line">${d.answer.trim()? df.user : '<span class="muted">(sin respuesta)</span>'}</p></div>
        ${r.verdict==="correct" && norm(target).join(" ")===norm(d.answer).join(" ") ? "" : `<div class="stack" style="gap:2px"><span class="eyebrow">${r.verdict==="correct" ? "Versión de referencia" : "Así se dice"}</span><p class="line">${df.target}</p></div>`}
        ${expl ? `<p class="rule">${esc(expl)}</p>` : ""}
        ${others.length ? `<div class="alts small"><span>También vale:</span>${others.slice(0,3).map(a=>`<span>${esc(a)}</span>`).join("")}</div>` : ""}
        ${step.k==="mixed" ? `<p class="small muted">Este era del patrón: <b>${esc(pname)}</b></p>` : ""}
        ${d.hint && r.verdict==="correct" ? `<p class="small muted">Con pista: cuenta como correcta, pero el patrón no sube de caja.</p>` : ""}
      </section>`;
    dock.innerHTML = `<div class="dock-in"><button class="btn primary big" data-act="next">Siguiente</button></div>`;
  }
  app.innerHTML = `
    <div class="drillhead">
      <div class="segs" aria-label="Frase ${n+1} de ${cur.plan.length}">${segs}</div>
      <span class="mono small">${n+1}/${cur.plan.length}</span>
      <button class="btn link" data-act="askend">Terminar</button>
    </div>
    ${d.confirmEnd ? `<div class="confirm"><p>¿Terminar ahora? Lo que respondiste queda guardado y cuenta para tu progreso.</p>
      <div class="row"><button class="btn primary" data-act="endnow">Sí, terminar</button><button class="btn ghost" data-act="noend">Seguir</button></div></div>` : ""}
    <section class="es-card">
      ${tag}
      <p class="es" lang="es">${esc(it.es)}</p>
      ${d.hint ? `<span class="hint">${esc(it.hint)}</span>` : ""}
    </section>
    ${body}`;
}

function chartSvg(){
  const ss = S.sessions.filter(s=>s.done && (s.attempts||[]).length).sort((a,b)=>a.startedAt-b.startedAt).slice(-20);
  if(ss.length<2) return `<p class="small muted">El gráfico aparece después de dos sesiones terminadas.</p>`;
  const W=320,H=150,L=34,R=12,T=12,B=24, iw=W-L-R, ih=H-T-B;
  const pts = ss.map((s,i)=>({x:L+(ss.length===1?iw/2:i*iw/(ss.length-1)), y:T+ih*(1-accOf(s.attempts)/100), v:accOf(s.attempts)}));
  const line = pts.map((p,i)=>(i?"L":"M")+p.x.toFixed(1)+","+p.y.toFixed(1)).join("");
  const area = line + `L${pts.at(-1).x.toFixed(1)},${T+ih}L${pts[0].x.toFixed(1)},${T+ih}Z`;
  const grid = [0,50,100].map(v=>{ const y=T+ih*(1-v/100); return `<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y+4}" text-anchor="end" font-size="10" fill="var(--muted)" font-family="var(--mono)">${v}%</text>`; }).join("");
  const last = pts.at(-1);
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Porcentaje de aciertos en las últimas ${ss.length} sesiones">
    ${grid}<path d="${area}" fill="var(--accent-soft)"/><path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <circle cx="${last.x}" cy="${last.y}" r="4" fill="var(--accent)"/>
    <text x="${Math.min(last.x, W-R)}" y="${Math.max(last.y-9, 10)}" text-anchor="end" font-size="11" fill="var(--ink)" font-family="var(--mono)">${last.v}%</text>
    <text x="${L}" y="${H-6}" font-size="10" fill="var(--muted)" font-family="var(--mono)">sesiones →</text></svg>`;
}

/* ---------- eventos ---------- */
document.addEventListener("click", async e => {
  const t = e.target.closest("[data-go],[data-act],[data-pat],[data-focus],[data-bank],[data-item]");
  if(!t) return;
  if(t.dataset.go){ S.view = t.dataset.go; S.ui.edit = undefined; render(); window.scrollTo(0,0); return; }

  if(t.dataset.focus){ e.stopPropagation(); S.state.focusId = t.dataset.focus; saveState(); toast("Foco cambiado: " + S.patterns[t.dataset.focus].name); render(); return; }
  if(t.dataset.pat){ S.ui.openPattern = S.ui.openPattern===t.dataset.pat ? null : t.dataset.pat; render(); return; }
  if(t.dataset.bank){ S.ui.bankPat = t.dataset.bank; S.ui.edit = undefined; render(); return; }
  if(t.dataset.item){ S.ui.edit = t.dataset.item; S.ui.confirmDel = false; render(); window.scrollTo(0,0); return; }
  const a = t.dataset.act;
  if(a==="start") startSession();
  else if(a==="resume") resumeSession();
  else if(a==="hint"){ S.drill.answer = $("#ans")?.value || ""; S.drill.hint = true; render(); focusAns(); }
  else if(a==="check") check();
  else if(a==="mic") toggleListening();
  else if(a==="testKey") testKey();
  else if(a==="next") next();
  else if(a==="askend"){ S.drill.answer = $("#ans")?.value ?? S.drill.answer; S.drill.confirmEnd = true; render(); }
  else if(a==="noend"){ S.drill.confirmEnd = false; render(); }
  else if(a==="endnow"){ if(S.cur.attempts.length) finalize(S.cur, false); else { S.cur.done = true; S.cur.changes=[]; saveSession(S.cur); S.cur=null; S.view="home"; render(); } }
  else if(a==="newItem"){ S.ui.edit = null; render(); }
  else if(a==="cancelEdit"){ S.ui.edit = undefined; render(); }
  else if(a==="askDel"){ S.ui.confirmDel = true; render(); }
  else if(a==="delItem"){ const p = clone(S.patterns[S.ui.bankPat]); p.items = p.items.filter(i=>i.id!==S.ui.edit); savePattern(p); S.ui.edit = undefined; toast("Frase borrada"); render(); }
  else if(a==="newPat"){ S.ui.newPat = true; render(); }
  else if(a==="cancelPat"){ S.ui.newPat = false; render(); }
  else if(a==="export") doExport();
  else if(a==="doImport") doImport();
  else if(a==="cancelImport"){ S.ui.importData = null; render(); }
});
document.addEventListener("submit", e => {
  e.preventDefault();
  if(e.target.id==="itemform"){
    const pid = $("#f-pat").value, es = $("#f-es").value.trim();
    const acc = $("#f-acc").value.split("\n").map(s=>s.trim()).filter(Boolean);
    if(!es || !acc.length){ toast("Falta la frase en español o al menos una respuesta."); return; }
    const editId = e.target.dataset.edit;
    const data = {es, accepted:acc, hint:$("#f-hint").value.trim(), ruleShort:$("#f-rule").value.trim()};
    if(editId){
      const oldP = Object.values(S.patterns).find(p=>p.items.some(i=>i.id===editId));
      const old = oldP.items.find(i=>i.id===editId);
      if(oldP.id===pid){ const p = clone(oldP); p.items = p.items.map(i=>i.id===editId ? {...i, ...data} : i); savePattern(p); }
      else { const a1 = clone(oldP); a1.items = a1.items.filter(i=>i.id!==editId); savePattern(a1); const b1 = clone(S.patterns[pid]); b1.items.push({...old, ...data}); savePattern(b1); }
    } else {
      const p = clone(S.patterns[pid]);
      p.items.push({id: pid + "-" + Date.now().toString(36), ...data, tag: p.items[0]?.tag || ""});
      savePattern(p);
    }
    S.ui.bankPat = pid; S.ui.edit = undefined; toast("Frase guardada"); render();
  }
  if(e.target.id==="cfgform"){
    S.cfg = {v:2, key:$("#c-key").value.trim(), model:$("#c-model").value.trim() || "gemini-flash-lite-latest", lang:$("#c-lang").value, autoCheck:$("#c-auto").checked};
    saveCfg(); toast("Ajustes guardados"); S.view = "home"; render(); return;
  }
  if(e.target.id==="patform"){
    const name = $("#np-name").value.trim(), rule = $("#np-rule").value.trim(), level = parseInt($("#np-level").value,10) || 6;
    if(!name || !rule) return;
    let id = baseNorm(name).replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "patron";
    while(S.patterns[id]) id += "-2";
    savePattern({id, name, level, order:99, rule, relatedTo:[], items:[]});
    S.ui.newPat = false; S.ui.bankPat = id; S.ui.edit = null; render();
  }
});
document.addEventListener("keydown", e => {
  if(S.view!=="drill") return;
  if(S.drill.phase==="answer" && e.key==="Enter" && !e.shiftKey && e.target.id==="ans"){ e.preventDefault(); check(); }
  else if(S.drill.phase==="feedback" && e.key==="Enter" && e.target.tagName!=="TEXTAREA"){ e.preventDefault(); next(); }
});
document.addEventListener("change", e => {
  if(e.target.id!=="importfile") return;
  const f = e.target.files?.[0]; if(!f) return;
  const rd = new FileReader();
  rd.onload = () => { try{ const d = JSON.parse(rd.result); if(!Array.isArray(d.patterns)) throw 0; S.ui.importData = d; render(); } catch { toast("Ese archivo no es un respaldo válido."); } };
  rd.readAsText(f);
});

function doExport(){
  const data = JSON.stringify({exportedAt:new Date().toISOString(), patterns:sortedPatterns(), meta:S.meta, state:S.state, sessions:S.sessions}, null, 1);
  const blob = new Blob([data], {type:"application/json"}), url = URL.createObjectURL(blob);
  const a = document.createElement("a"); a.href = url; a.download = `drills-ingles-${todayStr()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 3000); toast("Respaldo descargado");
}
function doImport(){
  const d = S.ui.importData; S.ui.importData = null;
  S.patterns = {}; for(const p of d.patterns) S.patterns[p.id] = clone(p);
  indexItems();
  if(d.meta?.rules) S.meta = clone(d.meta);
  S.state = d.state ? clone(d.state) : blankState(); S.state.patterns ||= {}; S.state.items ||= {};
  S.sessions = clone(d.sessions || []);
  persist(); toast("Respaldo cargado"); render();
}

let toastTimer;
function toast(msg){
  let el = $(".toast"); if(!el){ el = document.createElement("div"); el.className="toast"; el.setAttribute("role","status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(()=>{ el.hidden = true; }, 2600);
}

/* ---------- arranque ---------- */
function boot(){
  try{ const c = JSON.parse(localStorage.getItem(CFG_KEY) || "null"); if(c && typeof c==="object") Object.assign(S.cfg, c); }catch{}
  if(!(S.cfg.v>=2)){ if(S.cfg.model==="gemini-flash-latest" || S.cfg.model==="gemini-2.5-flash") S.cfg.model = "gemini-flash-lite-latest"; S.cfg.v = 2; saveCfg(); }
  let data = null;
  try{ data = JSON.parse(localStorage.getItem(LS_KEY) || "null"); }catch{}
  if(data && data.patterns && Object.keys(data.patterns).length){
    S.patterns = data.patterns; S.meta = data.meta || {rules:{}}; S.state = data.state || blankState(); S.sessions = data.sessions || [];
  } else {
    S.patterns = {}; for(const p of SEED.patterns) S.patterns[p.id] = clone(p);
    S.meta = clone(SEED.meta); S.state = blankState(); S.sessions = []; persist();
  }
  S.state.patterns ||= {}; S.state.items ||= {};
  indexItems(); S.loaded = {p:true, s:true, x:true, m:true};
  if(!S.cfg.key) S.view = "settings";
  render();
}
boot();
</script>
</body>
